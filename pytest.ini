[pytest]
python_files = test_*.py
python_functions = test_*
addopts = --ignore=tests/test_walker_manual.py --ignore=tests/test_scan_manual.py --ignore=tests/test_record_manual.py --ignore=tests/test_metadata_manual.py --ignore=tests/test_edge_cases.py
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

